<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>demo-video</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #player {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }
</style>
</head>
<body>
<div id="stage">
  <video id="player" playsinline webkit-playsinline preload="auto" muted src="video.mp4"></video>
</div>
<script>
(function () {
  var player = document.getElementById('player');
  var reported = {};

  function post(event, payload) {
    var body = Object.assign({ event: event }, payload || {});
    try {
      window.webkit.messageHandlers.page.postMessage(body);
    } catch (e) {
      // 浏览器里直接打开时没有原生通道，静默忽略。
    }
  }

  function once(event) {
    if (reported[event]) { return false; }
    reported[event] = true;
    return true;
  }

  player.addEventListener('loadedmetadata', function () {
    if (once('loadedmetadata')) {
      post('loadedmetadata', {
        duration: player.duration,
        width: player.videoWidth,
        height: player.videoHeight
      });
    }
    // 首帧定位：WKWebView 在 play() 之前不会主动绘制第一帧，
    // 不挪一下 currentTime，录制前的预览区就是一块纯黑。
    if (player.currentTime === 0) {
      try { player.currentTime = 0.05; } catch (e) {}
    }
  });

  player.addEventListener('playing', function () {
    if (once('playing')) { post('playing'); }
  });

  player.addEventListener('ended', function () {
    post('ended', { duration: player.duration });
  });

  player.addEventListener('error', function () {
    var code = player.error ? player.error.code : -1;
    post('error', { code: code });
  });

  // 画面常静音：声音由原生侧用 AVPlayer 在 app 进程内播（见 PageAudio.swift）。
  // WKWebView 的媒体音在别的进程渲染，ReplayKit 采不到，录出来会是整条静音。
  player.muted = true;

  var autoplay = false;
  var retries = 0;

  function startPlayback() {
    var attempt = player.play();
    if (!attempt || typeof attempt.catch !== 'function') {
      return;
    }
    attempt.then(function () {
      retries = 0;
    }).catch(function (err) {
      var name = String(err && err.name);

      // AbortError 是 seek / pause 打断了 play()，属于瞬时状态，稍后重试即可。
      if (name === 'AbortError' && retries < 20) {
        retries += 1;
        setTimeout(function () {
          if (autoplay && player.paused) { startPlayback(); }
        }, 150);
        return;
      }

      post('playfailed', { message: name });
    });
  }

  window.__page = {
    play: function () {
      autoplay = true;
      retries = 0;
      startPlayback();
    },
    pause: function () {
      autoplay = false;
      player.pause();
    },
    rewind: function () {
      autoplay = false;
      player.pause();
      if (player.readyState >= 1) {
        player.currentTime = 0;
      }
      reported = {};
      retries = 0;
      endPosted = false;
      startedPosted = false;
      watchFrames();
    },
    duration: function () {
      return player.duration || 0;
    }
  };

  player.addEventListener('canplay', function () {
    if (autoplay && player.paused) { startPlayback(); }
  });

  var endPosted = false;
  var startedPosted = false;

  function watchFrames() {
    if (!player.requestVideoFrameCallback) { return; }

    player.requestVideoFrameCallback(function (now, metadata) {
      // 首帧真正上屏时通知原生侧：声音按这个 mediaTime 起步，音画才对得上。
      if (!startedPosted && !player.paused) {
        startedPosted = true;
        post('started', { mediaTime: metadata.mediaTime });
      }

      if (!endPosted && player.duration > 0 && metadata.mediaTime >= player.duration - 0.08) {
        endPosted = true;
        post('ended', { duration: player.duration, mediaTime: metadata.mediaTime });
      }
      if (!endPosted) { watchFrames(); }
    });
  }

  watchFrames();

  post('ready');
})();
</script>
</body>
</html>
