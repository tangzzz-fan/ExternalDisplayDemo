name: ExternalDisplayDemo

options:
  bundleIdPrefix: com.jove
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  ExternalDisplayDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/VideoPage
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ExternalDisplayDemo
        PRODUCT_BUNDLE_IDENTIFIER: com.jove.externaldisplaydemo
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UKXWZ3FS84
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  ExternalDisplayDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: ExternalDisplayDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jove.externaldisplaydemo.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ExternalDisplayDemo:
    build:
      targets:
        ExternalDisplayDemo: all
        ExternalDisplayDemoTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-mockExternalDisplay": false
    test:
      config: Debug
      targets:
        - ExternalDisplayDemoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
