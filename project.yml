name: ExternalDisplayDemo

options:
  bundleIdPrefix: com.jove
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  ExternalDisplayDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # 全景素材：`Scripts/fetch-panorama-assets.sh` 取回的那批（不入库，在 gitignore 的
      # `.scratch/` 下）。作为**可选** folder 资源打进 bundle，目录结构原样保留 ——
      # `PanoramaAssetCatalog` 按 `panorama-assets/<文件名>` 读。
      #
      # `optional: true` 是这条的关键：没跑过获取脚本的机器上该目录不存在，
      # 工程照常生成、App 照常起，只是 `real` 档静默回落网格
      # （spec §4.6 那条「素材与代码解耦」）。
      - path: .scratch/panorama-assets
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_NAME: ExternalDisplayDemo
        PRODUCT_BUNDLE_IDENTIFIER: com.jove.externaldisplaydemo
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UKXWZ3FS84
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

schemes:
  ExternalDisplayDemo:
    build:
      targets:
        ExternalDisplayDemo: all
    run:
      config: Debug
      commandLineArguments:
        "-mockExternalDisplay": false
        "-mockAirMouse": false
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
